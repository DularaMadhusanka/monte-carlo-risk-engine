name: Daily Market Parameter Update

on:
  schedule:
    # Runs at 22:00 UTC (after US markets close) every weekday (Monday-Friday)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-params
  cancel-in-progress: false

jobs:
  update-parameters:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: Run Parameter Precomputation
        run: |
          mkdir -p artifacts
          python precompute_params.py --output artifacts/market_params.npz

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/market_params.npz

          # Only commit if the file actually changed
          git diff --staged --quiet || (git commit -m "Automated daily parameter update" && git push)
